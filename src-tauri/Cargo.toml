[package]
name = "helm"
version = "0.1.1"
edition = "2021"
description = "Helm: terminal command center for Claude Code, Codex and AI coding agents"
authors = ["meaynx <https://x.com/meaynx>"]
license = "MIT"
repository = "https://github.com/mdayan8/helm-terminal"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
